[pytest]
pythonpath = .
testpaths = suites
addopts = -ra
markers =
    unit: test unitaire d'une fonction interne (rapide, sans UI)
    ui: test d'interface (pilotage de l'application)
    export: test d'export de fichier (docx/xlsx/csv) + inspection
    pdf: nécessite LibreOffice (conversion PDF) — lane optionnelle
    visual: régression visuelle par capture — lane optionnelle
